services:
  - type: web
    name: anima-s3-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: DEVICE_TOKEN
        value: dev-token-123
      - key: DEVICE_TOKENS
        value: default:dev-token-123,esp32s3-fake-01:dev-token-123
