name: ANIMA-S3 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  protocol-and-server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y libopus0 libopus-dev
          pip install -r server/requirements.txt
          pip install pytest

      - name: Run protocol code generation
        run: |
          python protocol/gen.py

      - name: Check git diff on generated files
        run: |
          git diff --exit-code server/anima_server/transport/protocol_gen.py firmware/main/net/protocol_gen.h

      - name: Run protocol vector tests
        run: |
          PYTHONPATH=. python -m pytest protocol/tests -v

      - name: Run server unit and integration tests
        run: |
          PYTHONPATH=server python -m pytest server/tests -v

      - name: Run diagnostics check
        run: |
          PYTHONPATH=server python -m anima_server.diagnostics

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build and run firmware host tests
        run: |
          cmake -S firmware/host_test -B firmware/host_test/build
          cmake --build firmware/host_test/build
          ctest --test-dir firmware/host_test/build --output-on-failure


