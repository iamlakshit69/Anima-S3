[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "anima-server"
version = "0.1.0"
description = "ANIMA-S3 voice assistant server"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# Runtime dependencies — pin exact versions before Phase 1 merge (R14: verify each API).
dependencies = [
    # WebSocket server
    "websockets",
    # Numerics and DSP
    "numpy",
    "scipy",
    # STT
    "faster-whisper",
    # TTS
    "kokoro-onnx",
    # VAD — use ONNX path to avoid PyTorch install
    "silero-vad",
    # LLM client (OpenAI-compatible: Groq, Ollama, OpenAI)
    "openai",
    # Opus codec bindings (requires system libopus)
    "opuslib",
    # Data validation
    "pydantic",
    "jsonschema",
    # Config / constants
    "pyyaml",
    # Admin HTTP API
    "aiohttp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
anima-server = "anima_server.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["anima_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
